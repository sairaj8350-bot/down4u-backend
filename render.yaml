services:
  - type: web
    name: anyvideodownloader-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: YT_COOKIES
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
